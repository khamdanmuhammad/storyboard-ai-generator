<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Commercial Storyboard Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
        }

        /* Smooth transitions */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Loader animation */
        .loader {
            border: 3px solid #334155;
            border-top: 3px solid #3b82f6; /* Blue 500 */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .image-skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <header class="w-full max-w-5xl text-center mb-10 mt-4 fade-in">
        <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-4">
            Flow AI Ad Generator
        </h1>
        <p class="text-slate-400 text-lg">Upload produkmu, dapatkan prompt video 30 detik & storyboard realistis (Model + Produk).</p>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4 space-y-6 fade-in">
            <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
                <h2 class="text-xl font-semibold mb-4 flex items-center"><i class="fas fa-upload mr-2 text-blue-400"></i> Upload Produk</h2>
                
                <!-- Image Upload Area -->
                <div id="drop-area" class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer relative bg-slate-800/50">
                    <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*">
                    <div id="upload-prompt">
                        <i class="fas fa-cloud-upload-alt text-4xl text-slate-400 mb-3"></i>
                        <p class="text-sm text-slate-300">Klik atau Drag & Drop foto produk</p>
                        <p class="text-xs text-slate-500 mt-1">PNG, JPG up to 5MB</p>
                    </div>
                    <img id="image-preview" src="" alt="Preview" class="hidden max-h-48 mx-auto rounded-lg object-contain w-full">
                </div>

                <!-- Product Name/Context -->
                <div class="mt-4">
                    <label class="block text-sm font-medium text-slate-400 mb-1">Nama/Deskripsi Singkat Produk</label>
                    <input type="text" id="product-name" placeholder="Misal: Parfum pria aroma woody..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition-colors">
                </div>

                <!-- Generate Button -->
                <button id="generate-btn" class="w-full mt-6 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all transform active:scale-95 flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="btn-text">Generate Prompt & Storyboard</span>
                    <div id="btn-loader" class="loader ml-2 hidden"></div>
                </button>
                
                <!-- Error Message Container -->
                <div id="error-message" class="hidden mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-200 text-sm flex items-start">
                    <i class="fas fa-exclamation-triangle mt-1 mr-2"></i>
                    <span id="error-text">Terjadi kesalahan.</span>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl hidden fade-in" id="results-container">
            <h2 class="text-2xl font-bold mb-6 border-b border-slate-700 pb-4 flex items-center">
                <i class="fas fa-film mr-3 text-purple-400"></i> Hasil Storyboard (30 Detik)
            </h2>
            
            <div id="storyboard-list" class="space-y-8">
                <!-- Storyboard items will be injected here -->
            </div>
        </div>
    </main>

    <script>
        // Use empty string to let Canvas handle auth implicitly
        const apiKey = "";
        
        // State variables
        let uploadedBase64 = null;
        let mimeType = null;

        // DOM Elements
        const fileInput = document.getElementById('file-input');
        const imagePreview = document.getElementById('image-preview');
        const uploadPrompt = document.getElementById('upload-prompt');
        const generateBtn = document.getElementById('generate-btn');
        const productNameInput = document.getElementById('product-name');
        const resultsContainer = document.getElementById('results-container');
        const storyboardList = document.getElementById('storyboard-list');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');

        // Handle File Upload
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Simple validation
            if (!file.type.startsWith('image/')) {
                showError("Mohon upload file gambar.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const result = event.target.result;
                // Extract base64 data and mime type
                uploadedBase64 = result.split(',')[1];
                mimeType = file.type;

                // Update UI
                imagePreview.src = result;
                imagePreview.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
                hideError();
            };
            reader.readAsDataURL(file);
        });

        // Error handling utilities
        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
            errorMessage.classList.add('fade-in');
        }
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        function setLoadingState(isLoading) {
            generateBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = "Memproses...";
                btnLoader.classList.remove('hidden');
                hideError();
            } else {
                btnText.textContent = "Generate Prompt & Storyboard";
                btnLoader.classList.add('hidden');
            }
        }

        generateBtn.addEventListener('click', async () => {
            if (!uploadedBase64) {
                showError("Upload foto produk terlebih dahulu!");
                return;
            }

            setLoadingState(true);
            resultsContainer.classList.remove('hidden');
            storyboardList.innerHTML = ''; // Clear previous results

            const productName = productNameInput.value.trim() || "Produk dalam gambar";

            try {
                // Step 1: Generate Script & Prompts using Gemini Flash
                btnText.textContent = "Menganalisa & Membuat Script...";
                const scriptData = await generateScript(productName, uploadedBase64, mimeType);
                
                if (!scriptData || !scriptData.parts || scriptData.parts.length !== 3) {
                    throw new Error("Gagal membuat struktur script 3 bagian.");
                }

                // Render empty slots for the storyboard
                renderStoryboardSlots(scriptData.parts);

                // Step 2: Generate Images sequentially to avoid heavy concurrent load failures
                btnText.textContent = "Membuat Foto Storyboard...";
                for (let i = 0; i < scriptData.parts.length; i++) {
                    const part = scriptData.parts[i];
                    await generateStoryboardImage(part.image_prompt, i);
                }
                
                btnText.textContent = "Selesai!";
                setTimeout(() => setLoadingState(false), 2000);

            } catch (error) {
                console.error("Generator Error:", error);
                showError("Terjadi kesalahan: " + error.message + ". Silakan coba lagi.");
                setLoadingState(false);
            }
        });

        async function generateScript(productName, imageBase64, mimeType) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const systemInstruction = `Anda adalah Sutradara Video Komersial dan Ahli Prompt AI Video (seperti Sora, Lumalabs, Flow AI).
Tugas Anda adalah menganalisis foto produk yang diunggah dan membuat konsep video iklan berdurasi 30 detik, dibagi menjadi 3 bagian (masing-masing 10 detik).
Video harus terasa sangat halus (smooth transitions), realistis, dan berkelas tinggi.

Untuk setiap bagian (part 1, 2, 3), buatlah:
1. 'video_prompt': Prompt bahasa Inggris yang SANGAT DETAIL untuk AI Video Generator. Harus mencakup detail pergerakan kamera (misal: smooth slow pan, dynamic tracking shot, macro close-up), pencahayaan (cinematic lighting), dan aksi realistis.
2. 'image_prompt': Prompt bahasa Inggris SANGAT DETAIL untuk AI Image Generator untuk membuat storyboard frame. SYARAT MUTLAK: Harus menampilkan SEORANG MODEL (manusia realistis) yang sedang memegang, memakai, atau berinteraksi dengan produk yang mirip dengan gambar referensi. Gaya visual: Photorealistic, 8k, highly detailed.

Output HARUS dalam format JSON yang valid seperti ini:
{
  "parts": [
    {
      "part_number": 1,
      "duration": "0-10s",
      "scene_title": "Judul Singkat Scene",
      "video_prompt": "prompt video...",
      "image_prompt": "prompt gambar storyboard..."
    },
    ... (total 3 parts)
  ]
}`;

            const userPrompt = `Nama/Konteks Produk: ${productName}. Buatlah script dan prompt storyboardnya berdasarkan gambar ini.`;

            const payload = {
                contents: [{
                    role: "user",
                    parts: [
                        { text: userPrompt },
                        { inlineData: { mimeType: mimeType, data: imageBase64 } }
                    ]
                }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: { responseMimeType: "application/json" }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`API Text Error: ${response.status}`);
            
            const result = await response.json();
            const jsonText = result.candidates[0].content.parts[0].text;
            return JSON.parse(jsonText);
        }

        function renderStoryboardSlots(parts) {
            parts.forEach((part, index) => {
                const partHtml = `
                    <div class="bg-slate-700/50 rounded-xl p-5 border border-slate-600 flex flex-col md:flex-row gap-6 items-start fade-in" id="part-${index}">
                        
                        <!-- Text Details -->
                        <div class="w-full md:w-3/5 space-y-4">
                            <div class="flex items-center gap-3">
                                <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full">Part ${part.part_number} (${part.duration})</span>
                                <h3 class="text-lg font-semibold text-white">${part.scene_title}</h3>
                            </div>
                            
                            <div class="space-y-2">
                                <div class="bg-slate-800 rounded p-3 border border-slate-600 relative group">
                                    <span class="text-xs text-slate-400 font-semibold block mb-1 uppercase tracking-wider">Prompt Video (Flow AI / Sora):</span>
                                    <p class="text-sm text-slate-300 font-mono" id="video-prompt-${index}">${part.video_prompt}</p>
                                    <button onclick="copyToClipboard('video-prompt-${index}')" class="absolute top-2 right-2 text-slate-400 hover:text-white bg-slate-700 p-1.5 rounded opacity-0 group-hover:opacity-100 transition-opacity" title="Copy Prompt">
                                        <i class="far fa-copy"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Image Frame Slot -->
                        <div class="w-full md:w-2/5 flex flex-col gap-2">
                            <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Storyboard Frame:</span>
                            <div class="w-full aspect-video rounded-lg overflow-hidden border-2 border-slate-600 relative bg-slate-800 flex items-center justify-center group" id="image-container-${index}">
                                <!-- Skeleton Loader -->
                                <div class="absolute inset-0 image-skeleton" id="skeleton-${index}"></div>
                                <!-- Result Image (hidden initially) -->
                                <img id="storyboard-img-${index}" class="absolute inset-0 w-full h-full object-cover hidden z-10" alt="Storyboard Frame ${index + 1}">
                                <!-- Fullscreen button -->
                                <button onclick="viewImage('storyboard-img-${index}')" class="absolute bottom-2 right-2 bg-black/60 text-white p-2 rounded-lg z-20 hidden group-hover:block hover:bg-black transition-colors">
                                    <i class="fas fa-expand"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                storyboardList.insertAdjacentHTML('beforeend', partHtml);
            });
        }

        async function generateStoryboardImage(imagePrompt, index) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;
            
            // Append explicit instructions to ensure realistic model + product integration
            const finalPrompt = imagePrompt + " . Extremely high quality, 8k resolution, cinematic lighting, photorealistic. Must clearly show a human model using or posing with the product. Realistic textures.";

            const payload = {
                contents: [{ parts: [{ text: finalPrompt }] }],
                generationConfig: {
                    responseModalities: ['IMAGE'],
                    imageConfig: { aspectRatio: "16:9" }
                }
            };

            try {
                // Retry logic (Exponential Backoff) for robustness
                let retries = 3;
                let delay = 1000;
                let response;

                while (retries > 0) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) break;
                    if (response.status === 429) {
                        retries--;
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    } else {
                        throw new Error(`API Image Error: ${response.status}`);
                    }
                }

                if (!response || !response.ok) throw new Error("Gagal generate gambar setelah beberapa percobaan.");

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                
                if (part) {
                    const imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                    
                    // Update UI: Hide skeleton, show image
                    document.getElementById(`skeleton-${index}`).style.display = 'none';
                    const imgElement = document.getElementById(`storyboard-img-${index}`);
                    imgElement.src = imageUrl;
                    imgElement.classList.remove('hidden');
                    imgElement.classList.add('fade-in');
                } else {
                    throw new Error("Format respons gambar tidak valid.");
                }

            } catch (error) {
                console.error(`Error generating image for part ${index}:`, error);
                // Show error placeholder in the image slot
                document.getElementById(`skeleton-${index}`).classList.remove('image-skeleton');
                document.getElementById(`skeleton-${index}`).innerHTML = `<div class="h-full flex flex-col items-center justify-center text-red-400 p-4 text-center"><i class="fas fa-image-slash text-2xl mb-2"></i><span class="text-xs">Gagal memuat gambar</span></div>`;
            }
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            // Create temporary textarea
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                // Temporary visual feedback (could be improved with a toast notification)
                const btn = document.querySelector(`button[onclick="copyToClipboard('${elementId}')"]`);
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check text-green-400"></i>';
                setTimeout(() => { btn.innerHTML = originalHtml; }, 2000);
            } catch (err) {
                console.error('Failed to copy text', err);
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Simple overlay viewer for images
        function viewImage(imgId) {
            const src = document.getElementById(imgId).src;
            if(!src) return;
            
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 cursor-pointer fade-in';
            overlay.onclick = () => document.body.removeChild(overlay);
            
            const img = document.createElement('img');
            img.src = src;
            img.className = 'max-w-full max-h-full rounded-lg shadow-2xl';
            
            overlay.appendChild(img);
            document.body.appendChild(overlay);
        }

    </script>
</body>
</html>
